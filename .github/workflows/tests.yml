name: tests

# Published core job: not possible yet. The adapter's peer dependency
# @gramlot/native-html (the core js/ package) is not published on any registry,
# so no job can install the released core 0.2.0 from npm. Until the package
# name question is settled, the only test job links the core's main checkout
# and is informational (continue-on-error). See README.md, "Tests".

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-main:
    name: core main (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: gramlot-js-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot-js-server
      - name: Check out the core at main
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: gramlot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build the core JavaScript package
        working-directory: gramlot
        run: |
          npm --prefix js install --ignore-scripts --package-lock=false
          npm --prefix js run build
      - name: Link the core as @gramlot/native-html
        run: npm install --no-save ../gramlot/js
      - name: Node contract tests with coverage
        run: npm run test:coverage
      - name: Bun contract tests
        run: bun test test/native.test.mjs
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: gramlot-js-server/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
