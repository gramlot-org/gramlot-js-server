name: tests

# The three packages of the workspace: server/ (Node.js and Bun host adapter),
# serverless/ (exporter whose pages run in a browser Web Worker) and create/
# (npm create @gramlot).

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  GRAMLOT_SOURCE_REF: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'main' || 'develop' }}

permissions:
  contents: read

jobs:
  published-core:
    # Coordinated source checks; the historical job identifier is retained.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Prepare public source dependencies
        run: python scripts/prepare_source_dependencies.py
      - name: Show the core version
        run: node -p "require('./node_modules/@gramlot/gramlot/package.json').version"
      - name: Server, Node contract tests with coverage
        run: npm run test:coverage -w server
      - name: Server, Bun contract and gallery tests
        working-directory: server
        run: bun test test/server.test.mjs test/quickstart.test.mjs test/gallery.test.mjs
      - name: Serverless, tests with coverage
        run: npm run test:coverage -w serverless
      - name: "@gramlot/create, both templates built and started"
        run: npm test -w create
      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
      - name: Serverless, check of exported files in Chromium
        working-directory: serverless
        run: |
          mkdir -p build
          node src/cli.js build examples/hello-world/page.js -o build/hello-world.html
          node src/cli.js build examples/source-live/page.js -o build/source-live.html
          node src/cli.js build examples/inline-code/page.js -o build/inline-code.html
          node scripts/verify_export_browser.mjs build/hello-world.html ../node_modules/playwright/index.mjs - 'Hello World'
          node scripts/verify_export_browser.mjs build/source-live.html ../node_modules/playwright/index.mjs - 'Hello Worker' details
          node scripts/verify_inline_browser.mjs build/inline-code.html ../node_modules/playwright/index.mjs
          node scripts/verify_quickstart_browser.mjs ../node_modules/playwright/index.mjs
          node scripts/verify_page_module_browser.mjs ../node_modules/playwright/index.mjs
          node scripts/verify_gallery_browser.mjs ../node_modules/playwright/index.mjs
      - name: Server, checks in Chromium on Node and Bun (mount prefix, page logic, CSP, gallery)
        working-directory: server
        run: |
          chromium=$(node -p "require('../node_modules/playwright').chromium.executablePath()")
          node test/browser.mjs node ../node_modules/playwright/index.mjs "$chromium"
          node test/browser.mjs bun ../node_modules/playwright/index.mjs "$chromium"
          node test/verify_gallery_browser.mjs node ../node_modules/playwright/index.mjs
          node test/verify_gallery_browser.mjs bun ../node_modules/playwright/index.mjs
      - name: "@gramlot/create, templates in Chromium (from disk and from npm start)"
        working-directory: create
        run: node test/verify_templates_browser.mjs ../node_modules/playwright/index.mjs
      - name: Upload server coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: server/coverage/lcov.info
          flags: server
          disable_search: true
          fail_ci_if_error: false
      - name: Upload serverless coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: serverless/coverage/lcov.info
          flags: serverless
          disable_search: true
          fail_ci_if_error: false

  core-main:
    # Informational: the packages against the main branch of gramlot-org/gramlot.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: gramlot-js-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot-js-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Prepare public source dependencies
        run: python scripts/prepare_source_dependencies.py
      - name: Server, Node contract tests
        run: npm test -w server
      - name: Server, Bun contract and gallery tests
        working-directory: gramlot-js-server/server
        run: bun test test/server.test.mjs test/quickstart.test.mjs test/gallery.test.mjs
      - name: Serverless, tests
        run: npm test -w serverless
      - name: "@gramlot/create, tests"
        run: npm test -w create
      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
      - name: Serverless, checks in Chromium, including the local provider sentinel fixture
        working-directory: gramlot-js-server/serverless
        run: |
          mkdir -p build
          node src/cli.js build examples/source-live/page.js -o build/source-live.html
          node src/cli.js build examples/inline-code/page.js -o build/inline-code.html
          node scripts/verify_export_browser.mjs build/source-live.html ../node_modules/playwright/index.mjs - 'Hello Worker' details
          node scripts/verify_inline_browser.mjs build/inline-code.html ../node_modules/playwright/index.mjs
          node scripts/verify_worker_sentinel_browser.mjs ../node_modules/playwright/index.mjs
          node scripts/verify_quickstart_browser.mjs ../node_modules/playwright/index.mjs
          node scripts/verify_page_module_browser.mjs ../node_modules/playwright/index.mjs
          node scripts/verify_gallery_browser.mjs ../node_modules/playwright/index.mjs
      - name: Server, checks in Chromium on Node (mount prefix, page logic, CSP, gallery)
        working-directory: gramlot-js-server/server
        run: |
          chromium=$(node -p "require('../node_modules/playwright').chromium.executablePath()")
          node test/browser.mjs node ../node_modules/playwright/index.mjs "$chromium"
          node test/verify_gallery_browser.mjs node ../node_modules/playwright/index.mjs

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
