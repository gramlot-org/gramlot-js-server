name: tests

# The core is published as @gramlot/gramlot from 0.2.1. This job links the core's
# main checkout and is informational (continue-on-error) until a published-core
# job installs it from npm.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-main:
    name: core main (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: gramlot-js-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot-js-server
      - name: Check out the core at main
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: gramlot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build the core JavaScript package
        working-directory: gramlot
        run: |
          npm --prefix js install --ignore-scripts --package-lock=false
          npm --prefix js run build
      - name: Link the core as @gramlot/gramlot
        run: npm install --no-save ../gramlot/js
      - name: Node contract tests with coverage
        run: npm run test:coverage
      - name: Bun contract tests
        run: bun test test/native.test.mjs test/quickstart.test.mjs
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: gramlot-js-server/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
