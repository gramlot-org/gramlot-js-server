# Coverage is informational: no status check fails on a threshold.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "tests/**"
  - "examples/**"
  - "scripts/**"
  - "docs/**"
  - "docs_llm/**"

comment:
  layout: "files"
