# Coverage is informational: no status check fails on a threshold.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  server:
    paths:
      - "server/src/"
  browser:
    paths:
      - "browser/src/"

ignore:
  - "server/test/**"
  - "browser/tests/**"
  - "browser/examples/**"
  - "browser/scripts/**"
  - "docs/**"
  - "docs_llm/**"

comment:
  layout: "files"
