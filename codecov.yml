# Coverage is informational: no status check fails on a threshold.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  server:
    paths:
      - "server/src/"
  serverless:
    paths:
      - "serverless/src/"

ignore:
  - "server/test/**"
  - "serverless/tests/**"
  - "serverless/examples/**"
  - "serverless/scripts/**"
  - "docs/**"
  - "docs_llm/**"

comment:
  layout: "files"
