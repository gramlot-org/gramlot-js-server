name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-core:
    # Required: the exporter against the Gramlot core released on JSR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the released core and the exporter dependencies
        run: npm install --no-fund --no-audit
      - name: Show the core version
        run: node -p "require('./node_modules/@gramlot/gramlot/package.json').version"
      - name: Test with coverage
        run: npm run test:coverage
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-fund --no-audit playwright
          npx playwright install --with-deps chromium
      - name: Browser check of exported files
        run: |
          mkdir -p build
          node src/cli.js build examples/hello-world/page.js -o build/hello-world.html
          node src/cli.js build examples/source-live/page.js -o build/source-live.html
          node scripts/verify_native_html_browser.mjs build/hello-world.html node_modules/playwright/index.mjs - 'Hello World'
          node scripts/verify_native_html_browser.mjs build/source-live.html node_modules/playwright/index.mjs - 'Hello Worker' details
          node scripts/verify_quickstart_browser.mjs node_modules/playwright/index.mjs
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  core-main:
    # Informational: the exporter against the main branch of gramlot-org/gramlot.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: gramlot-serverless
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot-serverless
      - name: Check out the core at main
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: gramlot
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build the core JavaScript package
        working-directory: gramlot
        run: |
          npm --prefix js install --ignore-scripts --package-lock=false
          npm --prefix js run build
      - name: Install the exporter dependencies and link the core
        run: |
          npm install --no-fund --no-audit
          npm install --no-save --no-fund --no-audit @gramlot/gramlot@file:../gramlot/js
      - name: Test
        run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-fund --no-audit playwright
          npx playwright install --with-deps chromium
      - name: Browser checks, including the sentinel fixture of the core checkout
        run: |
          mkdir -p build
          node src/cli.js build examples/source-live/page.js -o build/source-live.html
          node scripts/verify_native_html_browser.mjs build/source-live.html node_modules/playwright/index.mjs - 'Hello Worker' details
          node scripts/verify_worker_sentinel_browser.mjs node_modules/playwright/index.mjs
          node scripts/verify_quickstart_browser.mjs node_modules/playwright/index.mjs

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_docs.py
